name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify HomeKit entitlement
        run: |
          if ! grep -q 'com.apple.developer.homekit' Resources/HomeClaw.entitlements; then
            echo "::error::HomeKit entitlement missing from HomeClaw.entitlements — readValue() will silently fail"
            exit 1
          fi

      - name: Build homeclaw-cli
        run: swift build --product homeclaw-cli

      - name: Run Swift tests
        run: swift test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build MCP server
        run: npm run build:mcp

  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: omarshahine/version-consistency-action@v1
        with:
          sets: |
            - name: "HomeClaw plugin"
              sources:
                - package.json:.version
                - openclaw/package.json:.version
                - openclaw/openclaw.plugin.json:.version
                - mcp-server/package.json:.version
                - .claude-plugin/plugin.json:.version
                - .claude-plugin/marketplace.json:.plugins[0].version

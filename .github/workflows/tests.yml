name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS runner minutes bill at 10x the Linux rate, so the two macOS jobs
  # only run on pull requests — re-running them on the merge commit's push
  # to main duplicated work the PR already proved.
  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify HomeKit entitlement
        run: |
          if ! grep -q 'com.apple.developer.homekit' Resources/HomeClaw.entitlements; then
            echo "::error::HomeKit entitlement missing from HomeClaw.entitlements — readValue() will silently fail"
            exit 1
          fi

      - name: Build homeclaw-cli
        run: swift build --product homeclaw-cli

      - name: Run Swift tests
        run: swift test

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build MCP server
        run: npm run build:mcp

  catalyst:
    name: Catalyst App
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The Xcode build phase compiles openclaw/dist via tsc, resolved from
      # node_modules before falling back to npx.
      - name: Install dependencies
        run: npm install

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Honor .xcode-version when the runner image has that Xcode, so CI compiles
      # with the same toolchain as local and release builds. Runner images lag
      # behind newly seeded betas, so a miss warns and continues rather than
      # failing — CI's job here is to prove the target compiles, and doing that
      # on a slightly older Xcode is far better than not doing it at all.
      - name: Select pinned Xcode
        run: |
          PIN="$(tr -d '[:space:]' < .xcode-version 2>/dev/null || true)"
          if [[ -z "$PIN" ]]; then
            echo "No .xcode-version pin; using runner default."
          else
            MATCH=""
            for app in /Applications/Xcode*.app; do
              [[ -d "$app" ]] || continue
              V="$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || true)"
              echo "found $app ($V)"
              [[ "$V" == "$PIN" ]] && MATCH="$app"
            done
            if [[ -n "$MATCH" ]]; then
              echo "Selecting pinned Xcode $PIN at $MATCH"
              sudo xcode-select -s "$MATCH/Contents/Developer"
            else
              echo "::warning::.xcode-version pins Xcode $PIN, not present on this runner. Building with the default instead."
            fi
          fi
          xcodebuild -version

      # The app target is never compiled by the Build job — only the SPM CLI is —
      # so a break in Sources/homeclaw (the HomeKit manager, socket server, and
      # views) could reach main with CI green. Signing is disabled because the
      # HomeKit entitlement is App Store-only and cannot be provisioned here;
      # this checks that the Catalyst target compiles and links, not that it
      # is distributable.
      - name: Build Catalyst app (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project HomeClaw.xcodeproj \
            -scheme HomeClaw \
            -configuration Debug \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            build \
            CODE_SIGNING_ALLOWED=NO \
            | tee /tmp/catalyst-build.log \
            | grep -E "error:|warning:|^\*\* BUILD" || true
          grep -q "^\*\* BUILD SUCCEEDED \*\*" /tmp/catalyst-build.log

  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: omarshahine/version-consistency-action@v1
        with:
          sets: |
            - name: "HomeClaw plugin"
              sources:
                - package.json:.version
                - openclaw/package.json:.version
                - openclaw/openclaw.plugin.json:.version
                - mcp-server/package.json:.version
                - .claude-plugin/plugin.json:.version
                - .claude-plugin/marketplace.json:.plugins[0].version

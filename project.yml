name: HomeClaw
options:
  bundleIdPrefix: com.shahine
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic

packages:
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser.git
    from: "1.7.0"
  SwiftTUI:
    url: https://github.com/rensbreur/SwiftTUI.git
    branch: main
  mcp-swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    exactVersion: "0.8.2"
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    exactVersion: "2.99.0"

targets:
  # ─── Unified Catalyst App ─────────────────────────────────
  HomeClaw:
    type: application
    platform: iOS
    attributes:
      UIKitCatalyst: optimized
    sources:
      - path: Sources/homeclaw
        excludes:
          - "**/_disabled/**"
      - path: Resources/HomeClaw.icns
        buildPhase: resources
      - path: Resources/HomeClaw.icon
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hadm.homeclaw
        PRODUCT_NAME: HomeClaw
        TARGETED_DEVICE_FAMILY: "6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/HomeClaw.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: HomeClaw
        MACOSX_BUNDLE_ICON_FILE: HomeClaw
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          ENABLE_APP_SANDBOX: NO
        Release:
          ENABLE_APP_SANDBOX: YES
          ENABLE_INCOMING_NETWORK_CONNECTIONS: YES
          ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
    entitlements:
      path: Resources/HomeClaw.entitlements
      properties:
        com.apple.developer.homekit: true
        com.apple.security.application-groups:
          - group.com.shahine.homeclaw
    dependencies:
      - target: macOSBridge
        platformFilter: maccatalyst
      - target: homeclaw-cli
        embed: false
      - sdk: HomeKit.framework
      - package: mcp-swift-sdk
        product: MCP
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOHTTP1
      - package: swift-nio
        product: NIOPosix
    preBuildScripts:
      - name: "Increment Build Number (Archive Only)"
        script: |
          # Only bump during Release builds (i.e. archive), not Debug
          if [ "$CONFIGURATION" != "Release" ]; then
            exit 0
          fi

          BUILD_NUMBER_FILE="${PROJECT_DIR}/.build-number"
          PLIST="${PROJECT_DIR}/Resources/Info.plist"

          if [ -f "$BUILD_NUMBER_FILE" ]; then
            BUILD_NUMBER=$(( $(cat "$BUILD_NUMBER_FILE") + 1 ))
          else
            BUILD_NUMBER=$(git -C "${PROJECT_DIR}" rev-list --count HEAD 2>/dev/null || echo "1")
          fi

          echo "$BUILD_NUMBER" > "$BUILD_NUMBER_FILE"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          echo "Build number set to $BUILD_NUMBER"

          # Sync marketing version from the latest `v*` tag (mirrors
          # fastlane/Fastfile's `marketing_version` helper). Without this,
          # Info.plist's CFBundleShortVersionString stays at whatever was
          # committed and the xcodebuild MARKETING_VERSION flag only
          # reaches build settings, not the binary's plist — App Store
          # uploads then land on the prior version's "train" and Apple
          # rejects them with "train X is closed" (error 90186).
          MARKETING_VERSION_FROM_TAG=$(git -C "${PROJECT_DIR}" describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//; s/+.*//')
          if [ -n "$MARKETING_VERSION_FROM_TAG" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION_FROM_TAG" "$PLIST"
            echo "Marketing version set to $MARKETING_VERSION_FROM_TAG"
          fi
        basedOnDependencyAnalysis: false
      - name: "Build MCP Server"
        script: |
          if command -v node &>/dev/null && [ -f "${PROJECT_DIR}/mcp-server/build.mjs" ]; then
            cd "${PROJECT_DIR}"
            if [ ! -f "mcp-server/dist/server.js" ] || [ "mcp-server/server.js" -nt "mcp-server/dist/server.js" ]; then
              node mcp-server/build.mjs 2>/dev/null || echo "warning: MCP server build skipped"
            fi
          fi
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: "Bundle CLI + Resources"
        script: |
          APP="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents"

          # Copy homeclaw-cli into Contents/MacOS/
          # CLI is a native macOS tool — look in the macOS build dir (Debug/),
          # not the Catalyst dir (Debug-maccatalyst/)
          CLI_PATH="${BUILD_DIR}/${CONFIGURATION}/homeclaw-cli"
          if [ -f "${CLI_PATH}" ]; then
            cp "${CLI_PATH}" "${APP}/MacOS/homeclaw-cli"
          elif [ -f "${BUILT_PRODUCTS_DIR}/homeclaw-cli" ]; then
            cp "${BUILT_PRODUCTS_DIR}/homeclaw-cli" "${APP}/MacOS/homeclaw-cli"
          fi

          # Copy mcp-server.js into Contents/Resources/
          MCP_JS="${PROJECT_DIR}/mcp-server/dist/server.js"
          if [ -f "${MCP_JS}" ]; then
            cp "${MCP_JS}" "${APP}/Resources/mcp-server.js"
          fi

          # Copy openclaw plugin files into Contents/Resources/openclaw/
          # The OpenClaw installer (issue #63) requires compiled JS at
          # ./dist/index.js when installing from a packaged path — TS source
          # is only accepted from a source checkout. Build dist/ before copy.
          OPENCLAW="${PROJECT_DIR}/openclaw"
          if [ -d "${OPENCLAW}" ]; then
            DEST="${APP}/Resources/openclaw"
            mkdir -p "${DEST}"

            # Build TypeScript -> dist/index.js. Resolve tsc in order:
            # plugin's own node_modules, root (hoisted), then npx fallback.
            # Hard-fail if dist/index.js is missing — shipping without it
            # reintroduces the install failure from issue #63.
            if [ -x "${OPENCLAW}/node_modules/.bin/tsc" ]; then
              TSC="${OPENCLAW}/node_modules/.bin/tsc"
            elif [ -x "${PROJECT_DIR}/node_modules/.bin/tsc" ]; then
              TSC="${PROJECT_DIR}/node_modules/.bin/tsc"
            elif command -v npx &>/dev/null; then
              TSC="npx --yes -p typescript tsc"
            else
              echo "error: cannot resolve tsc; install typescript via \`npm install\`" >&2
              exit 1
            fi
            ( cd "${OPENCLAW}" && $TSC -p tsconfig.json )
            if [ ! -f "${OPENCLAW}/dist/index.js" ]; then
              echo "error: openclaw/dist/index.js not produced — refusing to ship broken plugin" >&2
              exit 1
            fi

            cp "${OPENCLAW}/openclaw.plugin.json" "${DEST}/"
            cp "${OPENCLAW}/package.json" "${DEST}/"
            cp -R "${OPENCLAW}/src" "${DEST}/src"
            cp -R "${OPENCLAW}/skills" "${DEST}/skills"
            cp -R "${OPENCLAW}/dist" "${DEST}/dist"
            if [ -d "${OPENCLAW}/agents" ]; then
              cp -R "${OPENCLAW}/agents" "${DEST}/agents"
            fi
            if [ -d "${OPENCLAW}/hooks" ]; then
              cp -R "${OPENCLAW}/hooks" "${DEST}/hooks"
            fi
          fi
        basedOnDependencyAnalysis: false

  # ─── macOS Bridge Bundle (AppKit menu bar) ─────────────────
  macOSBridge:
    type: bundle
    platform: macOS
    sources:
      - path: Sources/macOSBridge
      - path: Sources/homeclaw/Bridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahine.homeclaw.macOSBridge
        PRODUCT_NAME: macOSBridge
        INFOPLIST_FILE: Sources/macOSBridge/Info.plist
        SKIP_INSTALL: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"

  # ─── UI Tests (App Store screenshot capture) ──────────────
  # Drives demo-mode HomeClaw via XCUITest to capture App Store screenshots.
  # Demo mode (HomeKitManager.isDemoMode) is gated on `--ui-test-demo` so we
  # never touch real HomeKit data. See fastlane `screenshots` lane.
  HomeClawUITests:
    type: bundle.ui-testing
    platform: iOS
    attributes:
      UIKitCatalyst: optimized
    sources:
      - path: Sources/HomeClawUITests
    dependencies:
      - target: HomeClaw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahine.homeclaw.uitests
        PRODUCT_NAME: HomeClawUITests
        TEST_TARGET_NAME: HomeClaw
        TARGETED_DEVICE_FAMILY: "6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # ─── Unit Tests ────────────────────────────────────────────
  HomeClawTests:
    type: bundle.unit-test
    platform: iOS
    attributes:
      UIKitCatalyst: optimized
    sources:
      - path: Tests/HomeClawTests
    dependencies:
      - target: HomeClaw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahine.homeclaw.tests
        PRODUCT_NAME: HomeClawTests
        TEST_TARGET_NAME: HomeClaw
        TARGETED_DEVICE_FAMILY: "6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # ─── CLI Tool ──────────────────────────────────────────────
  homeclaw-cli:
    type: tool
    platform: macOS
    sources:
      - path: Sources/homeclaw-cli
        excludes:
          - "**/Commands/_disabled/**"
    dependencies:
      - package: swift-argument-parser
        product: ArgumentParser
      - package: SwiftTUI
        product: SwiftTUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahine.homeclaw.cli
        PRODUCT_NAME: homeclaw-cli
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Resources/homeclaw-cli.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          ENABLE_APP_SANDBOX: NO
        Release:
          # Mac App Store distribution requires every bundled executable to
          # be sandboxed (ASC error 90296). The sandbox blocks SwiftTUI's
          # tcsetattr() silently, so the `ui` TUI subcommand is gated behind
          # the APP_STORE compilation condition (matches the main app).
          ENABLE_APP_SANDBOX: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"

schemes:
  HomeClaw:
    build:
      targets:
        HomeClaw: all
        macOSBridge: all
        homeclaw-cli: all
    run:
      config: Debug
      executable: HomeClaw
    archive:
      config: Release
    profile:
      config: Release

  HomeClawUITests:
    build:
      targets:
        HomeClaw: all
        macOSBridge: all
        homeclaw-cli: all
        HomeClawUITests: [test]
    test:
      config: Debug
      targets:
        - HomeClawUITests
    run:
      config: Debug
      executable: HomeClaw
